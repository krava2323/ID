name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    strategy:
      matrix:
        python-version: ["3.9", "3.10"] # 3. Мультиверсійне тестування
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest flake8 pytest-html
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics # 2. Linting

      - name: Test with pytest
        run: pytest --html=report.html --self-contained-html # 1. Тестування + 5. Звіт

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: report.html

  docker-build:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: | # 4. Збірка Docker
          if [ -f Dockerfile ]; then docker build . -t my-app; else echo "No Dockerfile found"; fi
